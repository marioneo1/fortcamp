<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortcamp combat voice tester</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#131b19;color:#edf3ec;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{margin:0 0 8px}p{color:#c1ccc2}button,select,input,textarea{font:inherit;color:inherit;background:#26352e;border:1px solid #53695b;border-radius:7px;padding:9px}button{cursor:pointer}button:hover{background:#374a3e}button:focus-visible{outline:2px solid #e4c879}header{position:sticky;top:0;background:#131b19f5;padding:14px 0;z-index:2}.controls{display:flex;flex-wrap:wrap;gap:8px}.card{background:#1f2b25;border:1px solid #415447;border-radius:10px;padding:14px;margin:12px 0}.line{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.label{flex:1;min-width:210px}.filename{font-size:12px;color:#b2c4b6;overflow-wrap:anywhere}.status{font-size:12px;color:#e4c879}.rating button[aria-pressed="true"]{background:#546f3e;border-color:#b7d789}.rating button.redo[aria-pressed="true"]{background:#713c39;border-color:#efa29b}.rating{display:flex;gap:6px}input.notes{width:100%;margin-top:10px;background:#17211b}#feedback{width:100%;min-height:140px;margin-top:12px}#now{min-height:25px;color:#e4c879}small{color:#bdcabc}#progress{margin:8px 0}.playing{border-color:#e4c879;box-shadow:0 0 0 1px #e4c879}@media(max-width:600px){main{padding:12px}.line{gap:8px}.label{width:100%;flex:auto}.rating button{padding:8px}}
</style>
<main><h1>Combat voice tester</h1><p>Play a clip, mark Keep or Redo, and add a note if needed. Only one sound plays at a time. Ratings save in this browser; copy the summary when finished. This pack is for review, not installed in combat.</p>
<header><div class="controls"><select id="race" aria-label="Race"><option value="">All races</option><option>Goblin</option><option>Human</option></select><select id="gender" aria-label="Gender"><option value="">All genders</option><option>Female</option><option>Male</option></select><select id="personality" aria-label="Personality"><option value="">All personalities</option><option>Guardian</option><option>Strategist</option><option>Opportunist</option><option>Survivor</option></select><select id="event" aria-label="Sound type"><option value="">All sounds</option><option>Attack</option><option>Hurt</option><option>Death</option></select><select id="review" aria-label="Review filter"><option value="">All ratings</option><option value="unrated">Unrated</option><option value="redo">Redo</option><option value="keep">Keep</option></select><button id="sequence">Play visible clips</button><button id="stop">Stop</button><label>Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label></div><div id="progress"></div><div id="now" aria-live="polite">Ready</div></header>
<div id="cards"></div><section class="card"><h2>Send your feedback</h2><div class="controls"><button id="copy">Copy summary</button><button id="download">Download feedback</button></div><textarea id="feedback" aria-label="Feedback summary" readonly></textarea><small id="storage"></small></section></main>
<script>
const catalogue=__CATALOGUE__;
const storeKey='fortcamp-vocal-review-approved';let ratings={};
try{ratings=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{}
const $=id=>document.getElementById(id),title=s=>s[0].toUpperCase()+s.slice(1);
const clips=catalogue.map(c=>{const [race,gender,personality,event,variant]=c.name.split('_');return {...c,race:title(race),gender:title(gender),personality:title(personality),event:title(event),variant}});
const player=new Audio();player.preload='none';let queue=[],timer=null,current=null,playEpoch=0;
function save(){try{localStorage.setItem(storeKey,JSON.stringify(ratings));$('storage').textContent='Ratings saved in this browser.'}catch{$('storage').textContent='Browser storage unavailable. Copy or download feedback before closing.'}summary()}
function summary(){let rows=clips.filter(c=>ratings[c.name]?.rating||ratings[c.name]?.note).map(c=>`${c.name}.wav: ${(ratings[c.name]?.rating||'unrated').toUpperCase()}${ratings[c.name]?.note?' — '+ratings[c.name].note:''}`);$('feedback').value='Fortcamp approved vocals\n'+(rows.join('\n')||'No ratings yet.');$('progress').textContent=`${clips.filter(c=>ratings[c.name]?.rating).length} / ${clips.length} rated`}
function visible(){return clips.filter(c=>(!$('race').value||c.race===$('race').value)&&(!$('gender').value||c.gender===$('gender').value)&&(!$('personality').value||c.personality===$('personality').value)&&(!$('event').value||c.event===$('event').value)&&(!$('review').value||($('review').value==='unrated'?!ratings[c.name]?.rating:ratings[c.name]?.rating===$('review').value)))}
function playing(){document.querySelectorAll('.card[data-name]').forEach(el=>el.classList.toggle('playing',el.dataset.name===current))}
function stop(){playEpoch++;queue=[];clearTimeout(timer);player.pause();player.currentTime=0;current=null;$('now').textContent='Stopped';playing()}
async function play(c){const ticket=++playEpoch;current=c.name;player.src=c.file||c.name+'.wav';player.volume=+$('volume').value;$('now').textContent=`Playing: ${c.race} ${c.gender.toLowerCase()} · ${c.personality} · ${c.event} ${c.variant}`;playing();try{await player.play()}catch{if(ticket!==playEpoch)return;queue=[];$('now').textContent='Could not play this file. Try Play again.'}}
function next(){if(queue.length)play(queue.shift());else{current=null;$('now').textContent='Finished';playing()}}
player.addEventListener('ended',()=>{timer=setTimeout(next,450)});player.addEventListener('error',()=>{queue=[];$('now').textContent='Audio unavailable; check the file or dev connection.'});
function render(){const host=$('cards');host.replaceChildren();for(const c of visible()){const card=document.createElement('section');card.className='card';card.dataset.name=c.name;const line=document.createElement('div');line.className='line';const label=document.createElement('div');label.className='label';const name=document.createElement('strong');name.textContent=`${c.race} ${c.gender.toLowerCase()} · ${c.personality} · ${c.event} ${c.variant}`;const file=document.createElement('div');file.className='filename';file.textContent=c.name+'.wav';const status=document.createElement('div');status.className='status';status.textContent=c.status;label.append(name,file,status);const button=document.createElement('button');button.textContent='▶ Play';button.setAttribute('aria-label','Play '+c.name);button.onclick=()=>{stop();play(c)};const choices=document.createElement('div');choices.className='rating';for(const choice of ['keep','redo','clear']){const b=document.createElement('button');b.textContent=choice==='keep'?'✓ Keep':choice==='redo'?'↻ Redo':'Clear';b.className=choice;b.setAttribute('aria-pressed',String(ratings[c.name]?.rating===choice));b.onclick=()=>{ratings[c.name]={...ratings[c.name],rating:choice==='clear'?null:choice};save();render()};choices.append(b)}line.append(label,button,choices);const note=document.createElement('input');note.className='notes';note.placeholder='Optional note, e.g. too human / too breathy';note.setAttribute('aria-label','Note for '+c.name);note.value=ratings[c.name]?.note||'';note.oninput=()=>{ratings[c.name]={...ratings[c.name],note:note.value};save()};card.append(line,note);host.append(card)}summary();playing()}
for(const id of ['race','gender','personality','event','review'])$(id).onchange=()=>{stop();render()};$('stop').onclick=stop;$('sequence').onclick=()=>{stop();queue=visible();next()};$('volume').oninput=()=>player.volume=+$('volume').value;
$('copy').onclick=async()=>{summary();try{await navigator.clipboard.writeText($('feedback').value);$('storage').textContent='Feedback copied—paste it into chat.'}catch{$('feedback').focus();$('feedback').select();$('storage').textContent='Summary selected. Copy it and paste into chat.'}};
$('download').onclick=()=>{const blob=new Blob([JSON.stringify({pack:'enemy-vocals-approved',ratings},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fortcamp-vocal-feedback-approved.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();save();
</script></html>
